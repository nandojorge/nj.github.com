<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Expectant mother</title><desc id="desc">Warm editorial illustration of a pregnant woman holding her belly, in the colours of Julya.</desc>
<defs>
<linearGradient id="skin" x1="150" y1="100" x2="252" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#E8B79D"/><stop offset="1" stop-color="#C88B72"/></linearGradient>
<linearGradient id="dress" x1="100" y1="280" x2="290" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#D7A48F"/><stop offset="1" stop-color="#AD705B"/></linearGradient>
<linearGradient id="linen" x1="190" y1="215" x2="345" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF9F3"/><stop offset="1" stop-color="#EAD6C8"/></linearGradient>
<linearGradient id="hair" x1="140" y1="35" x2="301" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#765242"/><stop offset="1" stop-color="#4A322A"/></linearGradient>
</defs>
